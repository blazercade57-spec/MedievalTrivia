<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Scribe's Trivia Hall</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a0e;--parch:#e8d3a2;--parch2:#d9bd83;--blood:#7a1f1f;--gold:#c79a2b;--forest:#1f3a2c;--night:#150f1c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'IM Fell English',Georgia,serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#3a2a4a,var(--night) 70%);display:flex;justify-content:center;overflow:hidden}
.castle{position:fixed;bottom:0;left:0;width:100%;height:38vh;opacity:.55;pointer-events:none}
.stars i{position:fixed;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
.hall{position:relative;width:min(760px,100%);height:100%;display:flex;flex-direction:column;padding:12px;animation:unroll 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:top}
@keyframes unroll{from{transform:scaleY(.05);opacity:0}to{transform:none;opacity:1}}
header{text-align:center;color:var(--gold);padding:6px 0 10px}
h1{font-family:'UnifrakturCook',serif;font-size:clamp(28px,5vw,44px);margin:0;text-shadow:0 0 14px rgba(199,154,43,.5),2px 2px 0 #000}
.score{display:flex;justify-content:center;gap:22px;font-size:18px;margin-top:4px;color:var(--parch)}
.score b{color:var(--gold);display:inline-block}
.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.6);color:#fff}}
#log{flex:1;overflow-y:auto;padding:16px 14px;background:linear-gradient(var(--parch),var(--parch2));border:6px double var(--blood);border-radius:6px;box-shadow:inset 0 0 60px rgba(90,50,10,.55),0 10px 40px #000;scroll-behavior:smooth}
.msg{max-width:88%;margin:10px 0;padding:10px 14px;font-size:19px;line-height:1.35;border-radius:4px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.herald{background:rgba(122,31,31,.1);border-left:5px solid var(--blood)}
.herald:before{content:"⚜ The Herald";display:block;font-family:'UnifrakturCook';color:var(--blood);font-size:16px}
.you{margin-left:auto;text-align:right;background:rgba(31,58,44,.15);border-right:5px solid var(--forest)}
.verdict-good{background:rgba(31,100,50,.2);border-left-color:#1f6432}
.verdict-bad{background:rgba(122,31,31,.2);animation:pop .45s both,shake .5s .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.opt{font:inherit;font-size:18px;color:var(--parch);background:linear-gradient(160deg,var(--blood),#4d1212);border:3px solid var(--gold);padding:12px 10px 18px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);transition:transform .2s,filter .2s;animation:pop .5s both}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
.opt:hover:not(:disabled){transform:translateY(-4px) rotate(-1deg);filter:brightness(1.25)}
.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opt:disabled{cursor:default;filter:grayscale(.6) brightness(.7)}
.opt.right{filter:none;background:linear-gradient(160deg,#2f7a43,#174a27);animation:glow 1s 2}
.opt.wrong{filter:none;background:linear-gradient(160deg,#333,#111)}
@keyframes glow{50%{box-shadow:0 0 28px 6px var(--gold)}}
.next{display:block;margin:8px auto 4px;font:inherit;font-family:'UnifrakturCook';font-size:22px;color:var(--ink);background:var(--gold);border:3px solid var(--blood);padding:8px 26px;border-radius:4px;cursor:pointer;animation:pop .5s both}
.next:hover{filter:brightness(1.15)}
.cursor:after{content:"▌";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.coin{position:fixed;font-size:26px;pointer-events:none;animation:rise 1.4s ease-out forwards}
@keyframes rise{to{transform:translateY(-220px) rotate(360deg);opacity:0}}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<svg class="castle" viewBox="0 0 800 200" preserveAspectRatio="xMidYMax slice"><path fill="#0a0710" d="M0 200V150h40v-30h12v-12h12v12h12v30h50V90h14V70h-8l22-30 22 30h-8v20h14v60h60v-40h14v-14h14v14h14v40h40V110h60V80h12V60l20-24 20 24v20h12v30h60v40h40v-50h14V70h14v-14h14v14h14v14h14v50h60v-30h20v-16h14v16h20v30h40v50z"/></svg>
<main class="hall">
  <header><h1>The Scribe's Trivia Hall</h1>
    <div class="score"><span>Gold: <b id="gold">0</b></span><span>Streak: <b id="streak">0</b></span><span>Questions: <b id="count">0</b></span></div></header>
  <div id="log" aria-live="polite"></div>
</main>
<script>
const $ = s => document.querySelector(s), log = $("#log");
for (let i = 0; i < 50; i++) { const s = document.createElement("i"); s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:${Math.random()*3}s`; $("#stars").appendChild(s); }

const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let seenIds = store("seenIds", []), recent = store("recent", []);
let gold = 0, streak = 0, count = 0;
const save = () => { try { localStorage.setItem("seenIds", JSON.stringify(seenIds)); localStorage.setItem("recent", JSON.stringify(recent.slice(-60))); } catch {} };
const scroll = () => log.scrollTo({ top: log.scrollHeight });
const bump = id => { const e = $(id); e.classList.remove("bump"); void e.offsetWidth; e.classList.add("bump"); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function say(text, cls = "herald") {
  const d = document.createElement("div"); d.className = "msg " + cls; log.appendChild(d);
  if (cls !== "herald" || matchMedia("(prefers-reduced-motion:reduce)").matches) { d.textContent = text; scroll(); return Promise.resolve(d); }
  d.classList.add("cursor");
  const label = d.textContent; let i = 0;
  return new Promise(res => { (function t() { d.dataset.t = text.slice(0, ++i); d.innerHTML = ""; d.append(document.createTextNode(d.dataset.t)); scroll();
    if (i < text.length) setTimeout(t, 18); else { d.classList.remove("cursor"); res(d); } })(); });
}
function coins(x, y, n) { for (let i = 0; i < n; i++) { const c = document.createElement("span"); c.className = "coin"; c.textContent = "🪙"; c.style.left = x + (Math.random() * 80 - 40) + "px"; c.style.top = y + "px"; c.style.animationDelay = i * 0.08 + "s"; document.body.appendChild(c); setTimeout(() => c.remove(), 1800); } }

async function ask() {
  const loading = await say("Let me consult the ancient scrolls…");
  let q;
  try {
    const r = await fetch("/api/question", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ seenIds, recent }) });
       if (!r.ok) throw new Error("Server replied " + r.status);
    q = await r.json();
  } catch (err) { loading.remove(); await say("Alas, the scribe is lost on the road. (" + err.message + ")"); return nextBtn("Summon the scribe again"); }
  loading.remove();
  if (q.reset) seenIds = [];
  if (q.id !== undefined) seenIds.push(q.id);
  recent.push(q.question); save();
  count++; $("#count").textContent = count; bump("#count");
  await say(q.question);
  const box = document.createElement("div"); box.className = "opts";
  q.options.forEach((o, i) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = o; b.onclick = e => answer(q, i, box, e); box.appendChild(b); });
  log.appendChild(box); scroll();
}

async function answer(q, i, box, e) {
  const btns = [...box.children]; btns.forEach(b => b.disabled = true);
  btns[q.answerIndex].classList.add("right");
  const ok = i === q.answerIndex;
  if (!ok) btns[i].classList.add("wrong");
  await say(q.options[i], "you");
  if (ok) {
    streak++; const earned = 10 + Math.min(streak - 1, 5) * 5; gold += earned;
    coins(e.clientX, e.clientY, 6);
    await say(`Huzzah! Thou art correct, and earn ${earned} gold. The answer is indeed: ${q.options[q.answerIndex]}.`, "herald verdict-good");
  } else {
    streak = 0;
    await say(`Alas, not so, brave traveller. The true answer is: ${q.options[q.answerIndex]}.`, "herald verdict-bad");
  }
  $("#gold").textContent = gold; $("#streak").textContent = streak; bump("#gold"); bump("#streak");
  nextBtn("Another riddle!");
}
function nextBtn(label) {
  const b = document.createElement("button"); b.className = "next"; b.textContent = label; b.autofocus = true;
  b.onclick = () => { b.remove(); ask(); }; log.appendChild(b); scroll(); b.focus({ preventScroll: true });
}
(async () => {
  await sleep(900);
  await say("Hail, traveller! I am the Herald of this hall. I shall test thy knowledge of lands, seas and kingdoms. Whether thou answerest rightly or wrongly, I shall reveal the truth.");
  ask();
})();
</script>
</body>
</html>
